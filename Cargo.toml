[package]
name = "syndesmos"
version = "0.3.0"
edition = "2024"
description = "Sentence bonds over UAX #29: the .desm rule file and the overlay that applies it — which segments bond into one sentence"
license = "MIT OR Apache-2.0"
authors = ["Bojan Durickovic <dev@deyanovich.org>"]
repository = "https://gitlab.com/syndesmos/syndesmos"
readme = "README.md"
keywords = ["sentence", "segmentation", "uax29", "unicode", "corpus"]
categories = ["text-processing", "internationalization"]
include = ["src/**", "cldr/*.desm", "README.md", "LICENSE-*", "Cargo.toml"]

[features]
default = ["uax29", "cli"]
# The drop-in: unicode-segmentation's sentence API with the bonds applied.
uax29 = ["dep:unicode-segmentation"]
# `desm cldr get`: fetch a CLDR release and write its lists as .desm files.
fetch = ["dep:ureq", "dep:zip"]
# The `desm` binary.
cli = ["dep:clap", "dep:sha2", "uax29", "fetch"]

[dependencies]
regex = "1"
unicode-segmentation = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
ureq = { version = "3", optional = true }
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }

[[bin]]
name = "desm"
path = "src/main.rs"
required-features = ["cli"]
